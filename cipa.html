/* ---------------- Import de membros via planilha (CSV) ---------------- */
function openImportMembersModal(unit){
  const mandates = unitMandates(unit.id);
  if(mandates.length===0){ toast('Cadastre um mandato antes de importar membros.', 'err'); return; }
  const defaultMandate = activeMandate(unit.id) || mandates[0];
  let parsedRows = null;

  openModal('Importar planilha de membros', `
    <div class="field"><label>Gestão (mandato) de destino *</label>
      <select id="impMandate">${mandates.map(m=>`<option value="${m.id}" ${m.id===defaultMandate.id?'selected':''}>${fmtDate(m.startDate)} – ${fmtDate(m.endDate)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Arquivo (.csv) *</label><input type="file" id="impFile" accept=".csv,text/csv"></div>
    <div class="hint">Use o modelo (botão "Baixar modelo" na tela de Membros). Colunas: Nome completo, Matrícula (opcional), Setor, Cargo/Função, Função na CIPA, Tipo, Representação e Data da Posse (DD/MM/AAAA, opcional; calcula a estabilidade dos eleitos). Apague ou edite a linha de exemplo antes de importar.</div>
    <div id="impPreview"></div>
  `, `<button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mImport" disabled>Importar</button>`);

  document.getElementById('mCancel').addEventListener('click', closeModal);
  const fileInput = document.getElementById('impFile');
  const previewBox = document.getElementById('impPreview');
  const importBtn = document.getElementById('mImport');

  fileInput.addEventListener('change', async ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    let text;
    try{ text = await file.text(); }
    catch(e){ toast('Não foi possível ler o arquivo.', 'err'); return; }
    const rows = parseCSVMembers(text);
    parsedRows = rows;
    if(rows.length===0){
      previewBox.innerHTML = `<div class="alert-box warn"><span>${ico('alerta')}</span><div class="txt">Nenhuma linha de dados encontrada. Confira se o arquivo é o modelo em CSV com cabeçalho na primeira linha.</div></div>`;
      importBtn.disabled = true;
      return;
    }
    const valid = rows.filter(r=>r.errors.length===0);
    previewBox.innerHTML = `
      <div class="hint" style="margin:8px 0;">${valid.length} válido(s) de ${rows.length} linha(s).</div>
      <div style="max-height:220px; overflow-y:auto; border:1px solid var(--border); border-radius:8px;">
        <table style="font-size:12px;"><thead><tr><th>Linha</th><th>Nome</th><th>Matrícula</th><th>Situação</th></tr></thead><tbody>
        ${rows.map(r=>`<tr>
          <td>${r.rowIndex}</td>
          <td>${esc(r.name||'—')}</td>
          <td>${esc(r.matricula||'—')}</td>
          <td>${r.errors.length? `<span class="pill pill-danger">${esc(r.errors.join('; '))}</span>` : '<span class="pill pill-ok">ok</span>'}</td>
        </tr>`).join('')}
        </tbody></table>
      </div>`;
    importBtn.disabled = valid.length===0;
  });

  importBtn.addEventListener('click', async ()=>{
    if(!parsedRows) return;
    const mandateId = document.getElementById('impMandate').value;
    const valid = parsedRows.filter(r=>r.errors.length===0);
    importBtn.disabled = true; importBtn.textContent = 'Importando…';
    let ok=0, fail=0, consecCount=0;
    for(const r of valid){
      const consec = checkConsecutive(unit.id, r.name, r.matricula, mandateId);
      if(consec) consecCount++;
      const id = await dbAdd('members', {
        unitId: unit.id, mandateId, name:r.name, matricula:r.matricula||'', setor:r.setor||'',
        jobTitle:r.jobTitle||'', role:r.role, type:r.type, representationType:r.representationType,
        dataPosse: r.dataPosse||null,
        consecutiveAlert: !!consec
      });
      if(id) ok++; else fail++;
    }
    closeModal();
    let msg = ok+' membro(s) importado(s).';
    if(fail) msg += ' '+fail+' falharam.';
    if(consecCount) msg += ' '+consecCount+' com alerta de 2º mandato — confira na lista.';
    toast(msg, fail? 'err' : (consecCount? 'ok' : 'ok'));
  });
}

/* ---------------- Exclusão de membros (com os treinamentos deles) ---------------- */
async function deleteMembersCascade(ids){
  const idSet = new Set(ids);
  const trs = S.trainings.filter(t=>idSet.has(t.memberId));
  for(const t of trs){
    if(t.certificateAssetId && S.assets){ try{ await S.assets.delete(t.certificateAssetId); }catch(e){} }
  }
  await Promise.all(trs.map(t=>dbDelete('trainings', t.id)));
  const results = await Promise.all(ids.map(id=>dbDelete('members', id)));
  return results.filter(Boolean).length;
}

    const valid = rows.filter(r=>!r.errors.length);
    box.innerHTML = `<div class="hint" style="margin:8px 0;">${valid.length} válido(s) de ${rows.length} linha(s).</div>
      <div style="max-height:240px; overflow-y:auto; border:1px solid var(--border); border-radius:8px;">
        <table style="font-size:12px;"><thead><tr><th>Linha</th><th>Membro</th><th>Curso</th><th>Conclusão</th><th>Situação</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${r.rowIndex}</td><td>${esc(r.memberName||'—')}</td><td>${esc(r.courseName||'—')}</td><td>${r.completionDate?fmtDate(r.completionDate):'—'}</td>
          <td>${r.errors.length? `<span class="pill pill-danger">${esc(r.errors.join('; '))}</span>` : '<span class="pill pill-ok">ok</span>'}</td></tr>`).join('')}
        </tbody></table></div>`;
    btn.disabled = valid.length===0;
    btn.textContent = valid.length ? 'Importar '+valid.length : 'Importar';
  });

  btn.addEventListener('click', async ()=>{
    if(!rows) return;
    const valid = rows.filter(r=>!r.errors.length);
    btn.disabled = true; btn.textContent = 'Importando…';
    let ok = 0, fail = 0;
    for(const r of valid){
      const id = await dbAdd('trainings', {memberId:r.member.id, courseName:r.courseName, hours:r.hours||null, completionDate:r.completionDate, expiryDate:r.expiryDate||null});
      if(id) ok++; else fail++;
    }
    closeModal();
    const skipped = rows.length - valid.length;
    toast(ok+' treinamento(s) importado(s).'+(fail?' '+fail+' falharam.':'')+(skipped?' '+skipped+' linha(s) ignorada(s).':''), fail?'err':'ok');
  });
}

/* ---------------- Treinamentos em massa: lançar para vários membros ---------------- */
function openGroupTrainingModal(unit){
  const mandates = unitMandates(unit.id);
  if(!mandates.length){ toast('Cadastre um mandato e membros antes.', 'err'); return; }
  let curId = (activeMandate(unit.id) || mandates[0]).id;
  const listHtml = ()=>{
    const ms = mandateMembers(curId);
    return ms.length ? ms.map(m=>`<label style="display:flex;gap:8px;align-items:center;font-weight:400;color:var(--text);font-size:13px;"><input type="checkbox" data-gm="${m.id}" checked> ${esc(m.name)}<span class="faint">${m.matricula?' · '+esc(m.matricula):''}${m.setor?' · '+esc(m.setor):''}</span></label>`).join('') : '<div class="faint">Nenhum membro nesta gestão.</div>';
  };
  openModal('Lançar treinamento em grupo', `
    <div class="field"><label>Gestão</label><select id="gMandate">${mandates.map(m=>`<option value="${m.id}" ${m.id===curId?'selected':''}>${fmtDate(m.startDate)} – ${fmtDate(m.endDate)}</option>`).join('')}</select></div>
    <div class="field"><label>Membros</label>
      <label style="display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px;color:var(--text);"><input type="checkbox" id="gAll" checked> Selecionar todos</label>
      <div id="gList" style="max-height:200px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;">${listHtml()}</div>
    </div>
    <div class="field"><label>Curso / treinamento *</label><input id="gCourse" placeholder="Ex: Curso básico de CIPA (NR-05)"></div>
    <div class="field-row">
      <div class="field"><label>Carga horária (h)</label><input type="number" id="gHours" min="0"></div>
      <div class="field"><label>Conclusão *</label><input type="date" id="gDone"></div>
    </div>
    <div class="field"><label>Validade (opcional)</label><input type="date" id="gExpiry"></div>
    <div class="hint">O certificado em arquivo não é anexado no lançamento em grupo. Membros que já têm este curso nesta data são ignorados.</div>
  `, `<button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Lançar</button>`);
  document.getElementById('mCancel').addEventListener('click', closeModal);
  const bindList = ()=>{
    const all = document.getElementById('gAll');
    all.checked = true;
    all.onchange = ()=>document.querySelectorAll('[data-gm]').forEach(c=>{ c.checked = all.checked; });
    document.querySelectorAll('[data-gm]').forEach(c=>c.addEventListener('change', ()=>{
      all.checked = [...document.querySelectorAll('[data-gm]')].every(x=>x.checked);
    }));
  };
  bindList();
  document.getElementById('gMandate').addEventListener('change', e=>{
    curId = e.target.value; document.getElementById('gList').innerHTML = listHtml(); bindList();
  });
  document.getElementById('mSave').addEventListener('click', async ()=>{
    const ids = [...document.querySelectorAll('[data-gm]')].filter(c=>c.checked).map(c=>c.dataset.gm);
    const course = document.getElementById('gCourse').value.trim();
    const done = document.getElementById('gDone').value;
    const expiry = document.getElementById('gExpiry').value || null;
    const hours = Number(document.getElementById('gHours').value) || null;
    if(!ids.length){ toast('Selecione ao menos um membro.', 'err'); return; }
    if(!course || !done){ toast('Informe o curso e a data de conclusão.', 'err'); return; }
    if(expiry && expiry < done){ toast('A validade não pode ser anterior à conclusão.', 'err'); return; }
    const btn = document.getElementById('mSave'); btn.disabled = true; btn.textContent = 'Lançando…';
    let ok = 0, dup = 0, fail = 0;
    for(const id of ids){
      if(trainingDuplicate(id, course, done)){ dup++; continue; }
      const nid = await dbAdd('trainings', {memberId:id, courseName:course, hours, completionDate:done, expiryDate:expiry});
      if(nid) ok++; else fail++;
    }
    closeModal();
    toast(ok+' treinamento(s) lançado(s).'+(dup?' '+dup+' já existia(m).':'')+(fail?' '+fail+' falharam.':''), fail?'err':'ok');
  });
}

/* ---------------- Atas: registrar e anexar ---------------- */
function openAtaModal(unit, presetMandateId, presetMonth){
  const mandates = unitMandates(unit.id);
  if(!mandates.length){ toast('Cadastre um mandato antes de registrar atas.', 'err'); return; }
  if(!S.assets){ toast('Upload de arquivos não está disponível.', 'err'); return; }
  let curM = byId(mandates, presetMandateId) || activeMandate(unit.id) || mandates[0];
  const today = todayISO();
  const lastDay = key => { const y = +key.slice(0,4), mo = +key.slice(5,7); return key+'-'+String(new Date(Date.UTC(y, mo, 0)).getUTCDate()).padStart(2,'0'); };
  openModal('Registrar ata de reunião', `
    <div class="field"><label>Gestão (mandato) *</label>
      <select id="aMandate">${mandates.map(m=>`<option value="${m.id}" ${m.id===curM.id?'selected':''}>${fmtDate(m.startDate)} – ${fmtDate(m.endDate)}</option>`).join('')}</select></div>
    <div class="field-row">
      <div class="field"><label>Tipo da reunião *</label><select id="aTipo">${ATA_TIPOS.map(t=>`<option value="${t}">${t}</option>`).join('')}</select></div>
      <div class="field"><label>Data da reunião *</label><input type="date" id="aData" ${presetMonth?`min="${presetMonth}-01" max="${lastDay(presetMonth)}"`:''}></div>
    </div>
    ${presetMonth ? `<div class="hint">Mês selecionado: ${MESES[+presetMonth.slice(5,7)-1]}/${presetMonth.slice(0,4)}.</div>` : ''}
    <div class="field"><label>Pauta / observações (opcional)</label><textarea id="aPauta" rows="3" placeholder="Ex.: análise de acidentes, inspeção de extintores..."></textarea></div>
    <div class="field"><label>Arquivo da ata * (até 5 MB)</label><input type="file" id="aFile"></div>
  `, `<button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Salvar ata</button>`);
  document.getElementById('mCancel').addEventListener('click', closeModal);
  document.getElementById('aMandate').addEventListener('change', e=>{ curM = byId(mandates, e.target.value); });
  document.getElementById('mSave').addEventListener('click', async ()=>{
    const tipo = document.getElementById('aTipo').value;
    const data = document.getElementById('aData').value;
    const pauta = document.getElementById('aPauta').value.trim();
    const file = document.getElementById('aFile').files[0];
    if(!data){ toast('Informe a data da reunião.', 'err'); return; }
    if(data < curM.startDate || data > curM.endDate){ toast('A data da reunião precisa estar dentro da gestão ('+fmtDate(curM.startDate)+' a '+fmtDate(curM.endDate)+').', 'err'); return; }
    if(!file){ toast('Anexe o arquivo da ata.', 'err'); return; }
    const btn = document.getElementById('mSave'); btn.disabled = true; btn.textContent = 'Enviando…';
    try{
      const res = await S.assets.upload(file);
      await dbAdd('documents', {
        unitId: unit.id, mandateId: curM.id, kind:'ata', category:'Ata de reunião',
        name: 'Ata '+tipo.toLowerCase()+' — '+fmtDate(data),
        reuniaoTipo: tipo, reuniaoData: data, pauta,
        assetId: res.id, url: res.url||'', contentType: res.contentType, sizeBytes: res.sizeBytes,
        uploadedAt: new Date().toISOString()
      });
      closeModal(); toast('Ata registrada e anexada à documentação.', 'ok');
    }catch(e){
      toast('Falha no envio: '+(e.message||e.code||e), 'err');
      btn.disabled = false; btn.textContent = 'Salvar ata';
    }
  });
}

/* ---------------- Document modal (upload) ---------------- */
function openDocModal(unit, presetMandateId){
  const mandates = unitMandates(unit.id);
  if(mandates.length===0){ toast('Cadastre um mandato antes de enviar documentos.', 'err'); return; }
  if(!S.assets){ toast('Upload de arquivos não está disponível nesta visualização.', 'err'); return; }
  let currentMandate = byId(mandates, presetMandateId) || mandates[0];

  function titleOptionsFor(mandate){
    if(mandate && mandate.renewal && mandate.renewal.stages && mandate.renewal.stages.length){
      return mandate.renewal.stages.map(s=>s.label).concat(DOC_FIXED_CATEGORIES);
    }
    return DOC_CATEGORIES_NO_CRONOGRAMA;
  }
  function titleSelectHtml(mandate){
    return titleOptionsFor(mandate).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('') + `<option value="__outros__">Outros documentos</option>`;
  }

  openModal('Enviar documento', `
    <div class="field"><label>Gestão (mandato) *</label>
      <select id="fDocMandate">${mandates.map(m=>`<option value="${m.id}" ${m.id===currentMandate.id?'selected':''}>${fmtDate(m.startDate)} – ${fmtDate(m.endDate)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Título do documento *</label>
      <select id="fDocTitle">${titleSelectHtml(currentMandate)}</select>
      <div class="hint">Os títulos seguem as etapas do cronograma de renovação desta gestão, quando houver um cadastrado.</div>
    </div>
    <div class="field" id="fDocCustomWrap" style="display:none;">
      <label>Novo título *</label>
      <input id="fDocCustomName" placeholder="Digite o título do documento">
    </div>
    <div class="field"><label>Arquivo * (até 5 MB)</label><input type="file" id="fDocFile"></div>
  `, `<button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Enviar</button>`);

  document.getElementById('mCancel').addEventListener('click', closeModal);

  const mandateSel = document.getElementById('fDocMandate');
  const titleSel = document.getElementById('fDocTitle');
  const customWrap = document.getElementById('fDocCustomWrap');

  function refreshCustomVisibility(){
    customWrap.style.display = titleSel.value==='__outros__' ? '' : 'none';
  }
  refreshCustomVisibility();

  mandateSel.addEventListener('change', ()=>{
    currentMandate = byId(mandates, mandateSel.value);
    titleSel.innerHTML = titleSelectHtml(currentMandate);
    refreshCustomVisibility();
  });
  titleSel.addEventListener('change', refreshCustomVisibility);

  document.getElementById('mSave').addEventListener('click', async ()=>{
    const isCustom = titleSel.value==='__outros__';
    const name = isCustom ? document.getElementById('fDocCustomName').value.trim() : titleSel.value;
    const fileInput = document.getElementById('fDocFile');
    const file = fileInput.files[0];
    if(!name || !file){ toast('Informe o título e selecione um arquivo.', 'err'); return; }
    const saveBtn = document.getElementById('mSave');
    saveBtn.disabled = true; saveBtn.textContent = 'Enviando…';
    try{
      const res = await S.assets.upload(file);
      await dbAdd('documents', {
        unitId: unit.id, mandateId: mandateSel.value,
        category: isCustom ? 'Outros documentos' : name,
        name, assetId: res.id, url: res.url, contentType: res.contentType, sizeBytes: res.sizeBytes,
        uploadedAt: new Date().toISOString()
      });
      closeModal(); toast('Documento enviado.', 'ok');
    }catch(e){
      toast('Falha no envio: '+(e.message||e.code), 'err');
      saveBtn.disabled=false; saveBtn.textContent='Enviar';
    }
  });
}

/* ---------------- Training modal ---------------- */
function openTrainingModal(unit){
  const mandates = unitMandates(unit.id);
  const memberIds = new Set();
  mandates.forEach(m=>mandateMembers(m.id).forEach(mem=>memberIds.add(mem.id)));
  const unitMembers = S.members.filter(m=>memberIds.has(m.id));
  if(unitMembers.length===0){ toast('Cadastre membros antes de registrar treinamentos.', 'err'); return; }
  openModal('Novo treinamento / certificado', `
    <div class="field"><label>Membro *</label>
      <select id="fTrMember">${unitMembers.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Curso / treinamento *</label><input id="fTrCourse" placeholder="Ex: Curso básico de CIPA (NR-05)"></div>
    <div class="field-row">
      <div class="field"><label>Carga horária (h)</label><input type="number" id="fTrHours" min="0"></div>
      <div class="field"><label>Conclusão *</label><input type="date" id="fTrDone"></div>
    </div>
    <div class="field"><label>Validade (opcional)</label><input type="date" id="fTrExpiry"></div>
    <div class="field"><label>Certificado (arquivo, opcional, até 5 MB)</label><input type="file" id="fTrFile"></div>
  `, `<button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Salvar</button>`);
  document.getElementById('mCancel').addEventListener('click', closeModal);
  document.getElementById('mSave').addEventListener('click', async ()=>{
    const memberId = document.getElementById('fTrMember').value;
    const courseName = document.getElementById('fTrCourse').value.trim();
    const completionDate = document.getElementById('fTrDone').value;
    if(!courseName || !completionDate){ toast('Informe curso e data de conclusão.', 'err'); return; }
    const saveBtn = document.getElementById('mSave');
    saveBtn.disabled = true; saveBtn.textContent = 'Salvando…';
    const data = {
      memberId, courseName,
      hours: Number(document.getElementById('fTrHours').value)||null,
      completionDate,
      expiryDate: document.getElementById('fTrExpiry').value || null
    };
    try{
      const file = document.getElementById('fTrFile').files[0];
      if(file && S.assets){
        const res = await S.assets.upload(file);
        data.certificateAssetId = res.id; data.certificateUrl = res.url;
      }
      await dbAdd('trainings', data);
      closeModal(); toast('Treinamento salvo.', 'ok');
    }catch(e){
      toast('Falha ao salvar: '+(e.message||e.code), 'err');
      saveBtn.disabled=false; saveBtn.textContent='Salvar';
    }
  });
}

/* ---------------- Renewal (cronograma) modals ---------------- */
function openRenewalChoiceModal(unit, mandate){
  openModal('Iniciar renovação', `
    <p class="muted" style="margin:0;">Mandato ${fmtDate(mandate.startDate)} – ${fmtDate(mandate.endDate)}. O período de inscrição de candidatos é sempre de ${INSCRICAO_DIAS} dias. Como deseja montar o cronograma do processo eleitoral, conforme a NR-05?</p>
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:6px;">
      <button class="btn btn-primary" id="bAuto" style="justify-content:center; padding:14px;">Gerar automático<br><span style="font-weight:400; font-size:12px;">A partir de ${PROCESS_LEAD_DAYS} dias antes do fim do mandato</span></button>
      <button class="btn" id="bManual" style="justify-content:center; padding:14px;">Preencher manualmente<br><span style="font-weight:400; font-size:12px;">Mesmas etapas, você define as datas</span></button>
    </div>
  `, `<button class="btn" id="mCancel">Cancelar</button>`);
  document.getElementById('mCancel').addEventListener('click', closeModal);
  document.getElementById('bAuto').addEventListener('click', ()=>{
    openRenewalEditModal(unit, mandate, generateAutoRenewalStages(mandate), 'auto');
  });
  document.getElementById('bManual').addEventListener('click', ()=>{
    openRenewalEditModal(unit, mandate, generateManualRenewalStages(), 'manual');
  });
}

function openRenewalEditModal(unit, mandate, stages, mode){
  function stageRowHtml(s, idx){
    const doneBox = `<label style="display:flex; gap:5px; align-items:center; font-weight:400; font-size:12px; white-space:nowrap; margin-left:8px; color:var(--text-muted);"><input type="checkbox" data-stage-idx="${idx}" data-stage-field="done" ${s.done?'checked':''}> concluída</label>`;
    if(s.type==='single'){
      return `<div class="field"><label>${esc(s.label)}</label><div style="display:flex; align-items:center;"><input type="date" data-stage-idx="${idx}" data-stage-field="date" value="${s.date||''}" style="flex:1;">${doneBox}</div></div>`;
    }
    return `<div class="field-row" style="align-items:flex-end;">
      <div class="field"><label>${esc(s.label)} — início</label><input type="date" data-stage-idx="${idx}" data-stage-field="startDate" value="${s.startDate||''}"></div>
      <div class="field"><label>${esc(s.label)} — fim${s.key==='inscricao'?' ('+INSCRICAO_DIAS+' dias)':''}</label><div style="display:flex; align-items:center;"><input type="date" data-stage-idx="${idx}" data-stage-field="endDate" value="${s.endDate||''}" style="flex:1;">${doneBox}</div></div>
    </div>`;
  }
  openModal('Cronograma de renovação', `
    <div class="hint" style="margin-bottom:2px;">${mode==='auto'?'Gerado automaticamente a partir de '+PROCESS_LEAD_DAYS+' dias antes do fim do mandato.':'Preenchimento manual.'} Datas e etapas concluídas podem ser ajustadas a qualquer momento, até a posse.</div>
    ${stages.map(stageRowHtml).join('')}
  `, `<button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Salvar cronograma</button>`);

  document.getElementById('mCancel').addEventListener('click', closeModal);
  document.querySelectorAll('[data-stage-idx]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const idx = Number(e.target.dataset.stageIdx);
      const field = e.target.dataset.stageField;
      if(field==='done'){ stages[idx].done = e.target.checked; return; }
      stages[idx][field] = e.target.value;
      if(stages[idx].key==='inscricao' && field==='startDate' && e.target.value && !stages[idx].endDate){
        stages[idx].endDate = addDaysISO(e.target.value, INSCRICAO_DIAS);
        const endInput = document.querySelector(`[data-stage-idx="${idx}"][data-stage-field="endDate"]`);
        if(endInput) endInput.value = stages[idx].endDate;
      }
    });
  });
  document.getElementById('mSave').addEventListener('click', async ()=>{
    const allDone = stages.every(s=>s.done);
    const ok = await dbUpdate('mandates', mandate.id, {
      renewal: {mode, status: allDone?'concluido':'em_andamento', updatedAt: new Date().toISOString(), stages}
    });
    if(ok){
      closeModal();
      toast(allDone? 'Processo de renovação concluído — posse registrada.' : 'Cronograma salvo.', 'ok');
    }
  });
}
