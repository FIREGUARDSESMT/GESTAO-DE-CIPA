<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal CIPA · SESMT</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f0f2f5; --border:#e1e4e8;
  --text:#1b2430; --text-muted:#5e6a78; --text-faint:#6b7684;
  --primary:#17415f; --primary-dark:#0f2e44; --primary-soft:#e6eef4;
  --danger:#a3302a; --danger-soft:#fbe9e7;
  --warn:#7a4f00; --warn-soft:#fbf0d9;
  --ok:#1f6b4c; --ok-soft:#e5f3ec;
  --radius:12px;
  --shadow:none;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161d; --surface:#1a1f29; --surface-2:#20262f; --border:#2c3441;
    --text:#e7ebf0; --text-muted:#a3adba; --text-faint:#727d8c;
    --primary:#5b9bd1; --primary-dark:#7bb0dd; --primary-soft:#1c2c3a;
    --danger:#e07a6c; --danger-soft:#3a2220;
    --warn:#e0b84a; --warn-soft:#3a3018;
    --ok:#5cc490; --ok-soft:#1c3327;
  }
}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a1f29; --surface-2:#20262f; --border:#2c3441;
  --text:#e7ebf0; --text-muted:#a3adba; --text-faint:#727d8c;
  --primary:#5b9bd1; --primary-dark:#7bb0dd; --primary-soft:#1c2c3a;
  --danger:#e07a6c; --danger-soft:#3a2220;
  --warn:#e0b84a; --warn-soft:#3a3018;
  --ok:#5cc490; --ok-soft:#1c3327;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5;
}
button{font-family:inherit;}
a{color:var(--primary);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

.app{display:flex; min-height:100vh; height:100%;}
.sidebar{
  width:250px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:14px 10px; padding-top:calc(14px + env(safe-area-inset-top,0px));
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 12px 8px; font-weight:600; font-size:16px; color:var(--text);}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;}
.side-section-title{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); font-weight:600; padding:0 12px; margin:22px 0 6px; display:flex; align-items:center;}
.side-section-title .icon-btn{margin-left:auto;width:28px;height:28px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.side-section-title .icon-btn:hover{border-color:var(--primary);color:var(--primary);}
.icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.unit-list{display:flex; flex-direction:column; gap:2px;}
.unit-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:8px; cursor:pointer; color:var(--text-muted); font-size:14px; font-weight:500;
}
.unit-item > span:first-child{display:flex; align-items:center; gap:10px;}
.unit-item .badge-count{margin-left:auto;}
.unit-item:hover{background:var(--surface-2);}
.unit-item.active{background:var(--primary-soft); color:var(--primary);}
.unit-item .badge-count{font-size:12px; font-weight:600; color:var(--text-muted); background:var(--surface-2); padding:1px 8px; border-radius:99px;}
.side-btn{
  margin:6px 4px; padding:8px 10px; border-radius:8px; border:1px dashed var(--border); background:none;
  color:var(--text-muted); cursor:pointer; text-align:left; font-size:13px;
}
.side-btn:hover{border-color:var(--primary); color:var(--primary);}
.side-footer{margin-top:auto; padding:10px 8px; font-size:11px; color:var(--text-faint);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:5; background:var(--bg); padding:calc(24px + env(safe-area-inset-top,0px)) 40px 0;
}
.topbar h1{margin:0; font-size:26px; font-weight:600;}
.topbar .sub{color:var(--text-muted); font-size:14px; margin:4px 0 0;}
.topbar .sub a{color:var(--primary); text-decoration:none; font-weight:500;}
.topbar .sub a:hover{text-decoration:underline;}
.tabs{display:flex; flex-wrap:wrap; margin-top:18px; border-bottom:1px solid var(--border);}
.tab{
  display:inline-flex; align-items:center; gap:8px; white-space:nowrap; cursor:pointer;
  padding:12px 4px; margin-right:28px; color:var(--text-muted); font-weight:500; font-size:14px;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tab:hover{color:var(--primary);}
.tab.active{color:var(--primary); border-bottom-color:var(--primary);}
.tab .tab-count{font-size:12px; font-weight:600; padding:1px 8px; border-radius:99px; background:var(--danger-soft); color:var(--danger);}

.content{padding:24px 40px 60px; overflow-x:auto;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px;}
.card h3{margin:0 0 12px; font-size:15px; font-weight:600;}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.row-title{font-weight:600; font-size:15px;}
.muted{color:var(--text-muted);}
.faint{color:var(--text-faint); font-size:12px;}

.btn{
  height:40px; padding:0 16px; border-radius:8px; border:1px solid #cbd2da; background:var(--surface);
  color:var(--text); cursor:pointer; font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:8px; text-decoration:none;
}
.btn:hover{border-color:var(--primary);}
.btn-primary{background:var(--primary); border-color:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-dark); border-color:var(--primary-dark);}
.btn-danger{color:var(--danger); border-color:var(--danger-soft);}
.btn-danger:hover{background:var(--danger-soft);}
.btn-sm{height:32px; padding:0 12px; font-size:12px;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px;}
.stat .num{font-size:24px; font-weight:700;}
.stat .label{color:var(--text-muted); font-size:12.5px;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; color:var(--text-faint); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; padding:8px 10px; border-bottom:1px solid var(--border);}
td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface-2);}

.pill{display:inline-flex; align-items:center; gap:5px; padding:2px 10px; border-radius:99px; font-size:12px; font-weight:600; white-space:nowrap;}
.pill-info{background:var(--primary-soft); color:var(--primary);}
.pill-ok{background:var(--ok-soft); color:var(--ok);}
.pill-warn{background:var(--warn-soft); color:var(--warn);}
.pill-danger{background:var(--danger-soft); color:var(--danger);}
.pill-muted{background:var(--surface-2); color:var(--text-muted);}

.empty{text-align:center; padding:40px 20px; color:var(--text-faint);}
.empty .big{font-size:28px; margin-bottom:8px;}

.alert-box{display:flex; gap:10px; padding:12px 14px; border-radius:8px; margin-bottom:10px; align-items:flex-start;}
.alert-box.danger{background:var(--danger-soft); color:var(--danger);}
.alert-box.warn{background:var(--warn-soft); color:var(--warn);}
.alert-box .txt{flex:1; color:var(--text);}
.alert-box .txt b{color:inherit;}

.modal-backdrop{
  position:fixed; inset:0; background:rgba(10,15,25,.5); display:flex; align-items:flex-start; justify-content:center;
  padding:5vh 16px; z-index:100; overflow-y:auto;
}
.modal{background:var(--surface); border-radius:var(--radius); width:100%; max-width:520px; box-shadow:0 20px 50px rgba(0,0,0,.3); margin-bottom:5vh;}
.modal-head{padding:16px 18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
.modal-head h3{margin:0; font-size:16px;}
.modal-close{cursor:pointer; color:var(--text-faint); font-size:18px; background:none; border:none;}
.modal-body{padding:18px; display:flex; flex-direction:column; gap:12px; max-height:65vh; overflow-y:auto;}
.modal-foot{padding:14px 18px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px;}

.field{display:flex; flex-direction:column; gap:5px;}
.field label{font-size:12.5px; font-weight:600; color:var(--text-muted);}
.field input, .field select, .field textarea{
  padding:8px 10px; border:1px solid var(--border); border-radius:7px; background:var(--bg); color:var(--text); font-size:13.5px; width:100%;
  font-family:inherit;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--primary); outline-offset:0; border-color:var(--primary);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.hint{font-size:11.5px; color:var(--text-faint);}

.toast-wrap{position:fixed; bottom:calc(16px + env(safe-area-inset-bottom,0px)); right:16px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--text); color:var(--bg); padding:10px 16px; border-radius:8px; font-size:13px; box-shadow:var(--shadow); max-width:300px;}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--ok);}

.doc-item{display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px;}
.doc-icon{width:34px; height:34px; border-radius:7px; background:var(--primary-soft); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
.doc-info{flex:1; min-width:0;}
.doc-info .name{font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.doc-info .meta{font-size:11.5px; color:var(--text-faint);}

.top-actions{display:flex; gap:8px; flex-wrap:wrap;}
.loading-line{padding:30px; text-align:center; color:var(--text-faint);}
.readonly-banner{background:var(--warn-soft); color:var(--warn); padding:9px 14px; border-radius:8px; font-size:12.5px; margin-bottom:14px;}
.avatar-mini{width:20px;height:20px;border-radius:50%; vertical-align:middle; margin-right:5px;}

.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:24px;}
.kpi{padding:20px 24px;}
.kpi + .kpi{border-left:1px solid var(--border);}
.kpi .num{font-size:30px; font-weight:600; line-height:1.2;}
.kpi .label{color:var(--text-muted);}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:24px; overflow:hidden;}
.panel-head{padding:18px 20px; font-weight:600; font-size:15px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.lrow{display:grid; grid-template-columns:150px minmax(0,1fr) auto; align-items:center; gap:16px; padding:14px 20px; border-top:1px solid var(--border);}
.lrow .t{font-weight:500;}
.lrow .s{color:var(--text-muted); font-size:13px;}
.sect-title{font-size:18px; font-weight:600; margin:0 0 12px;}
.stepper{display:grid; padding:20px 0 8px;}
.step{display:flex; flex-direction:column; align-items:center; min-width:0;}
.step .track{display:flex; align-items:center; width:100%;}
.step .ln{flex:1; height:2px; background:var(--border);}
.step .ln.done{background:var(--ok);}
.step .ln.none{background:transparent;}
.dot{width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; flex:none; border:2px solid #cbd2da; background:var(--surface); color:var(--text-muted);}
.dot.done{background:var(--ok); border-color:var(--ok); color:#fff;}
.dot.cur{background:var(--primary); border-color:var(--primary); color:#fff; box-shadow:0 0 0 4px var(--primary-soft);}
.dot.late{background:var(--danger); border-color:var(--danger); color:#fff; box-shadow:0 0 0 4px var(--danger-soft);}
.step .slbl{font-size:12px; margin-top:8px; text-align:center; color:var(--text-muted); padding:0 4px;}
.step .slbl.cur{font-weight:600; color:var(--primary);}
.opt-row{display:flex; flex-wrap:wrap; gap:16px;}
.opt{flex:1 1 260px; text-align:left; padding:18px; border-radius:10px; border:1px solid #cbd2da; background:var(--surface); cursor:pointer; color:var(--text); font-family:inherit;}
.opt:hover{border-color:var(--primary);}
.opt .opt-title{display:flex; align-items:center; gap:10px; font-weight:600; color:var(--text);}
.opt .opt-title .icon{color:var(--primary);}
.opt .opt-desc{margin-top:6px; color:var(--text-muted); font-size:13px;}
.two-col{display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start;}
.two-col > .main-col{flex:999 1 520px; min-width:0;}
.two-col > .side-col{flex:1 1 320px; min-width:0;}
.banner{display:flex; flex-wrap:wrap; align-items:center; gap:16px; padding:16px; border-radius:10px;}
.banner.warn{background:var(--warn-soft); color:var(--warn);}
.banner.danger{background:var(--danger-soft); color:var(--danger);}
.banner .b-text{flex:1 1 280px; color:var(--text);}
.banner .b-title{font-weight:600;}
.progress{height:8px; border-radius:99px; background:var(--border); overflow:hidden;}
.progress > div{height:100%; background:var(--primary);}
.lbl-s{font-size:12px; color:var(--text-faint); margin-bottom:2px;}
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));}
  .kpi:nth-child(3){border-left:none;}
  .kpi:nth-child(n+3){border-top:1px solid var(--border);}
  .lrow{grid-template-columns:1fr;}
  .topbar,.content{padding-left:16px; padding-right:16px;}
}
.auth-wrap{position:fixed; inset:0; z-index:300; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:16px;}
.auth-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:28px; width:100%; max-width:380px;}
@media print{
  .sidebar, .tabs, #btnEditUnit, .no-print{display:none !important;}
  .app{display:block;}
  .main{width:100%;}
  .topbar{padding-top:0;}
  body{background:#fff;}
  .card{box-shadow:none; border:1px solid #ccc; break-inside:avoid;}
  .content{padding:0; overflow-x:visible;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg></span> Portal CIPA</div>
    <div class="side-section-title">Geral</div>
    <div class="unit-list" id="globalNav"></div>
    <div class="side-section-title">Unidades <button class="icon-btn" id="btnAddUnit" aria-label="Nova unidade"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <div class="unit-list" id="unitList"><div class="faint" style="padding:8px;">Carregando…</div></div>
    <div class="side-footer" id="userFooter"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;">
        <h1 id="pageTitle">Selecione uma unidade</h1>
        <button class="btn" id="btnEditUnit" style="display:none;"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/></svg>Editar unidade</button>
      </div>
      <div class="sub" id="pageSub">Gestão de CIPA conforme NR-05</div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="authRoot" style="display:none;"></div>
<div class="toast-wrap" id="toastWrap"></div>
<div id="modalRoot"></div>

<script type="module">
import { firebaseConfig, exigirLiberacao } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import * as FS from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import * as AU from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
(function(){
"use strict";

/* ---------------- state ---------------- */
const S = {
  db: null, fdb: null, auth: null, assets: null,
  started: false,
  units: [], mandates: [], members: [], documents: [], trainings: [], technicians: [],
  currentUnitId: null,
  currentTab: 'visao',
  globalView: 'dashboard',
  dimensionamento: null,
  _dimGrau: 1,
  _dimNumEmp: '',
  _dimBuffer: null,
  _expandedMandates: {},
  _selMembers: {},
  _relatorioTipo: 'geral',
  _relatorioUnitId: null,
  unsub: [],
  ready: {units:false}
};

const ALERT_LEAD_DAYS = 70;    // aviso aparece quando faltam X dias para o fim do mandato
const PROCESS_LEAD_DAYS = 60;  // o cronograma do processo eleitoral é calculado a partir de X dias antes do fim
const INSCRICAO_DIAS = 15;     // duração fixa do período de inscrição de candidatos

/* ---------------- utils ---------------- */
function uid(){ return 'id_' + Math.random().toString(36).slice(2,11) + Date.now().toString(36); }
function fmtDate(d){ if(!d) return '—'; try{ const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('pt-BR'); }catch(e){ return d; } }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function addDaysISO(iso, days){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function addYearsISO(iso, years){ const d = new Date(iso+'T00:00:00'); d.setFullYear(d.getFullYear()+years); return d.toISOString().slice(0,10); }
function normStr(s){ return (s||'').trim().toLowerCase(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' '+type : '');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>t.remove(), 4200);
}
function byId(arr, id){ return arr.find(x=>x.id===id); }

/* ---------------- ícones (traço) ---------------- */
const ICON_PATHS = {
  painel:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  renovar:'<path d="M21 12a9 9 0 0 0-15-6.7L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15 6.7L21 16"/><path d="M16 16h5v5"/>',
  calc:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h8"/>',
  relat:'<path d="M3 3v18h18"/><path d="M8 17V11M13 17V7M18 17v-4"/>',
  predio:'<path d="M4 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16"/><path d="M14 10h5a1 1 0 0 1 1 1v10"/><path d="M3 21h18M8 8h2M8 12h2M8 16h2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 20h16"/>',
  download:'<path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/>',
  editar:'<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/>',
  usuario:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  calendario:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  alerta:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',

/* ---------------- importação de planilha de membros (CSV) ---------------- */
const IMPORT_ROLE_OPTIONS = ['Titular','Suplente','Presidente','Vice-presidente','Secretário'];
const IMPORT_TYPE_OPTIONS = ['Eleito','Indicado'];
const IMPORT_REP_OPTIONS = ['Empregados','Empregador'];

function stripAccents(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function normHeaderKey(h){ return stripAccents(h).toLowerCase().replace(/[^a-z0-9]/g,''); }
function matchEnumValue(value, options){
  const target = stripAccents(value||'').toLowerCase().trim();
  return options.find(o=>stripAccents(o).toLowerCase()===target) || null;
}
function parseFlexibleDate(str){
  if(!str) return null;
  str = str.trim();
  let y, mo, d;
  let m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m){ y = +m[1]; mo = +m[2]; d = +m[3]; }
  else {
    m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(!m) return null;
    d = +m[1]; mo = +m[2]; y = +m[3];
  }
  const t = new Date(Date.UTC(y, mo-1, d));
  if(t.getUTCFullYear()!==y || t.getUTCMonth()!==mo-1 || t.getUTCDate()!==d) return null; // data inexistente (ex.: 32/13/2026)
  return String(y).padStart(4,'0')+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}

function parseCSVTable(text){
  text = text.replace(/^\uFEFF/, '');
  const lines = text.split(/\r\n|\n|\r/).filter(l=>l.trim().length>0);
  if(lines.length===0) return [];
  const delim = (lines[0].match(/;/g)||[]).length >= (lines[0].match(/,/g)||[]).length ? ';' : ',';
  function parseLine(line){
    const cells = []; let cur='', inQuotes=false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(inQuotes){
        if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else { inQuotes=false; } }
        else cur+=ch;
      } else {
        if(ch==='"') inQuotes=true;
        else if(ch===delim){ cells.push(cur); cur=''; }
        else cur+=ch;
      }
    }
    cells.push(cur);
    return cells.map(c=>c.trim());
  }
  return lines.map(parseLine);
}

function validateImportRow(fields, rowIndex){
  const errors = [];
  if(!fields.name) errors.push('nome ausente');
  const role = matchEnumValue(fields.role, IMPORT_ROLE_OPTIONS);
  if(!role) errors.push('função na CIPA inválida ("'+(fields.role||'')+'")');
  const type = matchEnumValue(fields.type, IMPORT_TYPE_OPTIONS);
  if(!type) errors.push('tipo inválido ("'+(fields.type||'')+'")');
  const rep = matchEnumValue(fields.representationType, IMPORT_REP_OPTIONS);
  if(!rep) errors.push('representação inválida ("'+(fields.representationType||'')+'")');
  const dataPosse = parseFlexibleDate(fields.dataPosse);
  return {rowIndex, name:fields.name, matricula:fields.matricula||'', setor:fields.setor||'', jobTitle:fields.jobTitle||'', role, type, representationType:rep, dataPosse, errors};
}

function parseCSVMembers(text){
  const table = parseCSVTable(text);
  if(table.length===0) return [];
  const header = table[0].map(normHeaderKey);
  const idx = {
    name: header.findIndex(h=>h==='nome'||h==='nomecompleto'),
    matricula: header.findIndex(h=>h==='matricula'),
    setor: header.findIndex(h=>h==='setor'||h==='setordocipeiro'),
    jobTitle: header.findIndex(h=>h==='cargo'||h==='cargofuncao'||h==='cargofunca'),
    role: header.findIndex(h=>h==='funcaonacipa'||h==='funcao'),
    type: header.findIndex(h=>h==='tipo'),
    representationType: header.findIndex(h=>h==='representacao'),
    dataPosse: header.findIndex(h=>h==='datadaposse'||h==='dataposse')
  };
  const rows = [];
  for(let i=1;i<table.length;i++){
    const cells = table[i];
    if(cells.every(c=>!c || !c.trim())) continue;
    const get = key => idx[key]>=0 ? (cells[idx[key]]||'').trim() : '';
    rows.push(validateImportRow({
      name: get('name'), matricula: get('matricula'), setor: get('setor'), jobTitle: get('jobTitle'),
      role: get('role'), type: get('type'), representationType: get('representationType'),
      dataPosse: get('dataPosse')
    }, i+1));
  }
  return rows;
}

function downloadCSVFile(filename, header, example){
  const csv = '\uFEFF' + header + '\r\n' + example + '\r\n';
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function unitMembersAll(unitId){
  const ids = new Set(unitMandates(unitId).map(m=>m.id));
  return S.members.filter(m=>ids.has(m.mandateId));
}
function findMemberForTraining(unitId, name, matricula){
  const all = unitMembersAll(unitId);
  const mat = normStr(matricula), nm = normStr(name);
  const startOf = id => { const m = byId(S.mandates, id); return m ? (m.startDate||'') : ''; };
  const latest = arr => arr.slice().sort((a,b)=>startOf(b.mandateId).localeCompare(startOf(a.mandateId)))[0];
  if(mat){
    let c = all.filter(m=>normStr(m.matricula)===mat);
    if(!c.length) return {error:'membro não encontrado (matrícula '+matricula+')'};
    if(nm){
      const byName = c.filter(m=>normStr(m.name)===nm);
      if(!byName.length) return {error:'matrícula e nome não conferem'};
      c = byName;
    }
    return {member: latest(c)};
  }
  if(!nm) return {error:'informe a matrícula ou o nome'};
  const c = all.filter(m=>normStr(m.name)===nm);
  if(!c.length) return {error:'membro não encontrado ("'+name+'")'};
  const mats = new Set(c.map(m=>normStr(m.matricula)).filter(Boolean));
  if(mats.size>1) return {error:'nome com matrículas diferentes; informe a matrícula'};
  return {member: latest(c)};
}
function trainingDuplicate(memberId, course, done){
  return S.trainings.some(t=>t.memberId===memberId && normStr(t.courseName)===normStr(course) && t.completionDate===done);
}
function parseCSVTrainings(text, unitId){
  const table = parseCSVTable(text);
  if(table.length===0) return [];
  const header = table[0].map(normHeaderKey);
  const find = (...names)=>header.findIndex(h=>names.includes(h));
  const idx = {
    matricula: find('matricula'),
    name: find('nome','nomecompleto'),
    course: find('curso','treinamento','cursotreinamento','nomedocurso'),
    hours: find('cargahoraria','horas','ch'),
    done: find('datadeconclusao','dataconclusao','conclusao'),
    expiry: find('validade','datadevalidade','datavalidade')
  };
  const rows = [], seen = new Set();
  for(let i=1;i<table.length;i++){
    const cells = table[i];
    if(cells.every(c=>!c || !c.trim())) continue;
    const get = k => idx[k]>=0 ? (cells[idx[k]]||'').trim() : '';
    const errors = [];
    const found = findMemberForTraining(unitId, get('name'), get('matricula'));
    if(found.error) errors.push(found.error);
    const course = get('course');
    if(!course) errors.push('curso ausente');
    const done = parseFlexibleDate(get('done'));
    if(!done) errors.push('data de conclusão ausente ou inválida');
    const expRaw = get('expiry');
    const expiry = expRaw ? parseFlexibleDate(expRaw) : null;
    if(expRaw && !expiry) errors.push('validade inválida');
    if(done && expiry && expiry < done) errors.push('validade anterior à conclusão');
    const hRaw = get('hours');
    const hours = hRaw ? Number(hRaw.replace(',','.')) : null;
    if(hRaw && (isNaN(hours) || hours<0)) errors.push('carga horária inválida');
    if(found.member && course && done){
      const key = found.member.id+'|'+normStr(course)+'|'+done;
      if(trainingDuplicate(found.member.id, course, done) || seen.has(key)) errors.push('já cadastrado');
      seen.add(key);
    }
    rows.push({rowIndex:i+1, member:found.member||null, memberName:found.member?found.member.name:(get('name')||get('matricula')), courseName:course, hours:hours||null, completionDate:done, expiryDate:expiry, errors});
  }
  return rows;
}

/* ---------------- Firebase: banco, arquivos e login ---------------- */
const COL_PREFIX = 'cipa_'; // todas as coleções do portal começam com cipa_ para não colidir com outros sistemas do projeto

function buildAdapters(app){
  const fdb = FS.initializeFirestore(app, {ignoreUndefinedProperties:true});
  S.fdb = fdb;
  S.db = {
    collection: name => { const ref = FS.collection(fdb, COL_PREFIX+name); return {
      onSnapshot: (next, err)=>FS.onSnapshot(ref, next, err),
      add: data => FS.addDoc(ref, data)
    };},
    doc: path => { const p = path.split('/'); const ref = FS.doc(fdb, COL_PREFIX+p[0], p[1]); return {
      onSnapshot: (next, err)=>FS.onSnapshot(ref, snap=>next({exists: snap.exists(), data: ()=>snap.data()}), err),
      set: d=>FS.setDoc(ref, d),
      update: d=>FS.updateDoc(ref, d),
      delete: ()=>FS.deleteDoc(ref)
    };}
  };
  // Arquivos: guardados no próprio Firestore em base64, divididos em pedaços (sem Storage, sem plano Blaze).
  const CHUNK = 700000;                 // caracteres base64 por pedaço (~700 KB), abaixo do limite de 1 MiB por documento
  const MAX_BYTES = 5 * 1024 * 1024;    // tamanho máximo por arquivo
  const arqCol = () => FS.collection(fdb, COL_PREFIX+'arquivos');
  const fileToBase64 = file => new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(String(r.result).split(',')[1] || '');
    r.onerror = ()=>reject(new Error('Não foi possível ler o arquivo.'));
    r.readAsDataURL(file);
  });
  async function chunksOf(id){
    const snap = await FS.getDocs(FS.query(arqCol(), FS.where('fileId','==',id)));
    return snap.docs.map(d=>d.data()).sort((x,y)=>x.idx-y.idx);
  }
  S.assets = {
    maxBytes: MAX_BYTES,
    async upload(file){
      if(file.size > MAX_BYTES) throw new Error('O arquivo tem mais de 5 MB. Reduza ou comprima antes de enviar.');
      const b64 = await fileToBase64(file);
      const id = 'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
      const total = Math.max(1, Math.ceil(b64.length/CHUNK));
      const type = file.type || 'application/octet-stream';
      try{
        for(let i=0;i<total;i++){
          await FS.setDoc(FS.doc(fdb, COL_PREFIX+'arquivos', id+'_'+String(i).padStart(3,'0')),
            {fileId:id, idx:i, total, data:b64.slice(i*CHUNK,(i+1)*CHUNK), contentType:type, name:file.name});
        }
      }catch(e){ try{ await S.assets.delete(id); }catch(_){} throw e; }
      return {id, url:'', contentType:type, sizeBytes:file.size};
    },
    async delete(id){
      const snap = await FS.getDocs(FS.query(arqCol(), FS.where('fileId','==',id)));
      await Promise.all(snap.docs.map(d=>FS.deleteDoc(d.ref)));
    },
    async open(id, name){
      const parts = await chunksOf(id);
      if(!parts.length) throw new Error('Arquivo não encontrado.');
      const bin = atob(parts.map(p=>p.data).join(''));
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      return {blob: new Blob([bytes], {type: parts[0].contentType}), name: name || parts[0].name || 'arquivo'};
    }
  };
}

/* ---------------- subscriptions ---------------- */
function subscribeAll(){
  const cols = [
    ['units', d => { S.units = d; S.ready.units = true; renderSidebar(); renderMain(); }],
    ['mandates', d => { S.mandates = d; renderMain(); }],
    ['members', d => { S.members = d; renderMain(); }],
    ['documents', d => { S.documents = d; renderMain(); }],
    ['trainings', d => { S.trainings = d; renderMain(); }],
    ['technicians', d => { S.technicians = d; renderMain(); }]
  ];
  cols.forEach(([name, cb])=>{
    const unsub = S.db.collection(name).onSnapshot(
      snap => { cb(snap.docs.map(d=>({id:d.id, ...d.data()}))); },
      err => { console.error(name, err); if(err.code!=='unavailable') toast('Erro ao carregar '+name+': '+err.message, 'err'); }
    );
    S.unsub.push(unsub);
  });
  const unsubDim = S.db.doc('config/dimensionamento').onSnapshot(
    snap => { S.dimensionamento = snap.exists ? snap.data() : null; renderMain(); },
    err => { console.error('dimensionamento', err); }
  );
  S.unsub.push(unsubDim);
}

// consecutive mandate check: mesmo nome completo + matrícula, na mesma unidade, no mandato imediatamente anterior
function checkConsecutive(unitId, name, matricula, currentMandateId){
  if(!name) return null;
  const list = unitMandates(unitId);
  const idx = list.findIndex(m=>m.id===currentMandateId);
  if(idx === -1 || idx+1 >= list.length) return null;
  const prevMandate = list[idx+1]; // ordenado do mais novo ao mais antigo: o próximo é a gestão imediatamente anterior
  const n = normStr(name), mat = normStr(matricula);
  const match = mandateMembers(prevMandate.id).find(mm=>{
    if(normStr(mm.name)!==n) return false;
    if(mat && normStr(mm.matricula)) return normStr(mm.matricula)===mat; // com matrícula nos dois lados: confere nome e matrícula
    return true; // sem matrícula em algum dos lados: confere só pelo nome
  });
  if(match) return {prevMandate, match, byNameOnly: !(mat && normStr(match.matricula))};
  return null;
}

/* ---------------- Estabilidade provisória (Art. 10, II, "a" do ADCT) ---------------- */
// Aplica-se a membros ELEITOS pelos EMPREGADOS (titulares e suplentes) — não a indicados pelo empregador.
// Vigência: do início do mandato (aproximação do registro da candidatura) até 1 ano após o fim do mandato.
function memberHasStability(member){
  return member.representationType==='Empregados' && member.type==='Eleito';
}
function memberStabilityPeriod(member, mandate){
  if(!memberHasStability(member)) return null;
  const start = member.dataPosse || (mandate && mandate.startDate) || null;
  if(!start) return null;
  const end = addYearsISO(start, 2);
  return {start, end, active: todayISO() <= end, approximated: !member.dataPosse};
}
function stabilityCellHtml(member, mandate){
  if(!memberHasStability(member)) return '<span class="faint">não se aplica</span>';
  const stab = memberStabilityPeriod(member, mandate);
  if(!stab) return '<span class="pill pill-warn">informe a data da posse</span>';
  const approxNote = stab.approximated ? ' <span class="faint">(estimado)</span>' : '';
  return (stab.active
    ? `<span class="pill pill-ok">vigente até ${fmtDate(stab.end)}</span>`
    : `<span class="pill pill-muted">encerrada em ${fmtDate(stab.end)}</span>`) + approxNote;
}

function mandateRenewalAlert(m){
  if(!m.endDate) return null;
  const d = daysBetween(todayISO(), m.endDate);
  const hasRenewal = !!(m.renewal && m.renewal.stages && m.renewal.stages.length);
  const renewalDone = hasRenewal && m.renewal.status === 'concluido';
  if(renewalDone) return null; // processo já concluído — sem alerta
  if(m.startDate && m.startDate >= m.endDate){
    return {level:'danger', label:'Datas inválidas', invalid:true, text:'As datas do mandato estão invertidas ('+fmtDate(m.startDate)+' – '+fmtDate(m.endDate)+'). Edite o mandato e corrija o início e o fim.'};
  }
  if(d < 0){
    return {level:'danger', label:'Vencido', text:'Mandato vencido em '+fmtDate(m.endDate)+' — regularizar renovação imediatamente.'};
  }
  if(d <= PROCESS_LEAD_DAYS){
    if(hasRenewal){
      return {level:'warn', label:'Em andamento', text:'Mandato encerra em '+d+' dia(s) ('+fmtDate(m.endDate)+') — processo de renovação em andamento.'};
    }
    return {level:'danger', label:'Vencido', text:'Prazo para iniciar o processo de renovação está vencido — faltam '+d+' dia(s) para o fim do mandato ('+fmtDate(m.endDate)+') e o processo eleitoral ainda não foi iniciado, conforme a NR-05.'};
  }
  if(d <= ALERT_LEAD_DAYS){
    return {level:'warn', label:'Renovar em breve', text:'Mandato encerra em '+d+' dia(s) ('+fmtDate(m.endDate)+') — próximo da renovação. Inicie o processo eleitoral conforme a NR-05.'};
  }
  return null;
}

/* ---------------- progresso / status de um processo de renovação ---------------- */
function renewalProgress(renewal){
  const total = renewal.stages.length;
  const done = renewal.stages.filter(s=>s.done).length;
  return {done, total};
}
function renewalStatusInfo(renewal){
  const {done, total} = renewalProgress(renewal);
  if(renewal.status==='concluido' || (total>0 && done>=total)) return {level:'ok', text:'Concluído'};
  const today = todayISO();
  const late = renewal.stages.some(s=>{
    if(s.done) return false;
    const ref = s.type==='single' ? s.date : s.endDate;
    return ref && ref < today;
  });
  if(late) return {level:'danger', text:'Atrasado'};
  return {level:'warn', text:'Em andamento'};
}
function allRenewalProcesses(){
  return S.mandates.filter(m=>m.renewal && m.renewal.stages && m.renewal.stages.length)
    .map(m=>({mandate:m, unit:byId(S.units, m.unitId)}))
    .sort((a,b)=>(a.mandate.endDate||'').localeCompare(b.mandate.endDate||''));
}

/* ---------------- Dimensionamento da CIPA (Quadro I — NR-05, Anexo I) ---------------- */
const DEFAULT_DIMENSIONAMENTO = {
  brackets: ['0 a 19','20 a 29','30 a 50','51 a 80','81 a 100','101 a 120','121 a 140','141 a 300','301 a 500','501 a 1000','1001 a 2500','2501 a 5000','5001 a 10000'],
  bracketMax: [19,29,50,80,100,120,140,300,500,1000,2500,5000,10000],
  matrix: {
    1: {efetivos:[null,null,null,null,1,1,1,1,2,4,5,6,8],  suplentes:[null,null,null,null,1,1,1,1,2,3,4,5,6]},
    2: {efetivos:[null,null,null,1,1,2,2,3,4,5,6,8,10],    suplentes:[null,null,null,1,1,1,1,2,3,4,5,6,8]},
    3: {efetivos:[null,1,1,2,2,2,3,4,5,6,8,10,12],         suplentes:[null,1,1,1,1,1,2,2,4,4,6,8,8]},
    4: {efetivos:[null,1,2,3,3,4,4,4,5,6,9,11,13],         suplentes:[null,1,1,2,2,2,2,3,4,5,7,8,10]}
  },
  extra: {1:{efetivos:1,suplentes:1}, 2:{efetivos:1,suplentes:1}, 3:{efetivos:2,suplentes:2}, 4:{efetivos:2,suplentes:2}}
};

function effectiveDimConfig(){ return S.dimensionamento || DEFAULT_DIMENSIONAMENTO; }

function findBracketIndex(config, n){
  for(let i=0;i<config.bracketMax.length;i++){ if(n<=config.bracketMax[i]) return i; }
  return config.bracketMax.length-1;
}

function calcDimensionamento(config, grau, n){
  const g = config.matrix[grau];
  if(!g || n==null || isNaN(n) || n<0) return null;
  if(n>10000){
    const lastIdx = config.bracketMax.length-1;
    const baseEf = g.efetivos[lastIdx]||0, baseSu = g.suplentes[lastIdx]||0;
    const groups = Math.ceil((n-10000)/2500);
    const ex = config.extra[grau]||{efetivos:0,suplentes:0};
    return {efetivos: baseEf+ex.efetivos*groups, suplentes: baseSu+ex.suplentes*groups, bracketLabel:'Acima de 10.000 (+'+groups+' grupo(s) de 2.500)'};
  }
  const idx = findBracketIndex(config, n);
  const ef=g.efetivos[idx], su=g.suplentes[idx];
  return {efetivos: ef||0, suplentes: su||0, bracketLabel: config.brackets[idx], notRequired: ef==null && su==null};
}

function trainingExpiryAlert(t){
  if(!t.expiryDate) return null;
  const d = daysBetween(todayISO(), t.expiryDate);
  if(d < 0) return {level:'danger', text:'Certificado vencido em '+fmtDate(t.expiryDate)+'.'};
  if(d <= 45) return {level:'warn', text:'Certificado vence em '+d+' dia(s) ('+fmtDate(t.expiryDate)+').'};
  return null;
}

function computeAllAlerts(){
  const alerts = [];
  S.units.forEach(u=>{
    const curM = activeMandate(u.id);
    unitMandates(u.id).forEach(m=>{
      if(!curM || m.id!==curM.id) return; // gestões antigas não geram alertas
      const ra = mandateRenewalAlert(m);
      if(ra) alerts.push({...ra, unit:u, mandate:m, type:'renewal'});
      mandateMembers(m.id).forEach(mem=>{
        if(mem.consecutiveAlert){
          alerts.push({level:'warn', text:'2º mandato consecutivo possível: '+mem.name+' (verificar elegibilidade conforme NR-05).', unit:u, mandate:m, member:mem, type:'consecutive'});
        }
      });
    });
  });
  S.trainings.forEach(t=>{
    const ta = trainingExpiryAlert(t);
    if(ta){
      const mem = byId(S.members, t.memberId);
      alerts.push({...ta, member:mem, unit: mem ? byId(S.units, mem.unitId) : null, training:t, type:'training'});
    }
  });
  return alerts;
}

/* ---------------- Processos de renovação (todas as unidades) ---------------- */
function stepperHtml(renewal, status){
  const SHORT = {edital:'Edital', inscricao:'Inscrição', divulgacao_inscritos:'Inscritos', campanha:'Campanha', eleicao:'Eleição', apuracao:'Apuração', posse:'Posse'};
  const stages = renewal.stages, n = stages.length;
  const curIdx = stages.findIndex(st=>!st.done);
  return `<div class="stepper" style="grid-template-columns:repeat(${n},minmax(0,1fr));">` + stages.map((st,i)=>{
    const isDone = !!st.done, isCur = i===curIdx;
    const late = isCur && status.level==='danger';
    const dotCls = isDone ? 'done' : (isCur ? (late?'late':'cur') : '');
    const leftCls = i===0 ? 'none' : (stages[i-1].done ? 'done' : '');
    const rightCls = i===n-1 ? 'none' : (isDone ? 'done' : '');
    const inner = isDone ? ico('check','style="width:14px;height:14px;stroke-width:2.5"') : (i+1);
    return `<div class="step"><div class="track"><div class="ln ${leftCls}"></div><div class="dot ${dotCls}">${inner}</div><div class="ln ${rightCls}"></div></div><div class="slbl ${isCur?'cur':''}">${esc(SHORT[st.key]||st.label)}</div></div>`;
  }).join('') + '</div>';
}

function renderRenewalsDashboard(){
  const processes = allRenewalProcesses();
  const emAndamento = processes.filter(p=>renewalStatusInfo(p.mandate.renewal).level!=='ok');
  const concluidos = processes.filter(p=>renewalStatusInfo(p.mandate.renewal).level==='ok');

  const awaiting = [];
  S.units.forEach(u=>{
    const m = activeMandate(u.id);
    if(!m) return;
    if(m.renewal && m.renewal.stages && m.renewal.stages.length) return;
    const ra = mandateRenewalAlert(m);
    if(ra && !ra.invalid) awaiting.push({mandate:m, unit:u, alert:ra});
  });

  function awaitingCard(x){
    const d = daysBetween(todayISO(), x.mandate.endDate);
    const when = d>=0 ? 'faltam '+d+' dia(s)' : 'encerrado há '+Math.abs(d)+' dia(s)';
    return `<div class="card" style="padding:24px;">
      <div class="row">
        <div><div class="row-title" style="font-size:16px;">${esc(x.unit.name)}</div><div class="muted" style="font-size:13px;">Mandato ${fmtDate(x.mandate.startDate)} – ${fmtDate(x.mandate.endDate)} · ${when}</div></div>
        <span class="pill ${x.alert.level==='danger'?'pill-danger':'pill-warn'}">${x.alert.label}</span>
      </div>
      <div style="margin:20px 0 14px; font-weight:500;">Como deseja montar o cronograma do processo eleitoral?</div>
      <div class="opt-row">
        <button class="opt" data-start-renewal="${x.mandate.id}" data-mode="auto"><div class="opt-title">${ico('calendario')}Gerar automaticamente</div><div class="opt-desc">Começa ${PROCESS_LEAD_DAYS} dias antes do fim do mandato, com ${INSCRICAO_DIAS} dias de inscrição. Você pode ajustar qualquer data depois.</div></button>
        <button class="opt" data-start-renewal="${x.mandate.id}" data-mode="manual"><div class="opt-title">${ico('editar')}Preencher manualmente</div><div class="opt-desc">Mantém as mesmas etapas da NR-05, e você informa as datas de cada uma.</div></button>
      </div>
    </div>`;
  }

  function processCard(p){
    const {mandate, unit} = p;
    const renewal = mandate.renewal;
    const {done, total} = renewalProgress(renewal);
    const status = renewalStatusInfo(renewal);
    const next = renewal.stages.find(st=>!st.done);
    const pillCls = status.level==='ok'?'pill-ok':status.level==='danger'?'pill-danger':'pill-info';
    return `<div class="card" style="padding:24px;">
      <div class="row">
        <div>
          <div class="row-title" style="font-size:16px;">${unit? esc(unit.name) : '<span class="faint">Unidade removida</span>'}</div>
          <div class="muted" style="font-size:13px;">Mandato ${fmtDate(mandate.startDate)} – ${fmtDate(mandate.endDate)} · cronograma ${renewal.mode==='auto'?'automático':'manual'} · ${done} de ${total} etapas</div>
        </div>
        <span class="pill ${pillCls}">${status.text}</span>
      </div>
      ${stepperHtml(renewal, status)}
      <div class="row" style="margin-top:12px;">
        <div class="muted" style="font-size:13px;">${next ? 'Próxima etapa: '+esc(next.label) : 'Todas as etapas concluídas'}</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          ${unit? `<button class="btn" data-open-unit-renewals="${unit.id}">Ver unidade</button>` : ''}
          <button class="btn btn-primary" data-manage-renewal="${mandate.id}">Gerenciar cronograma</button>
        </div>
      </div>
    </div>`;
  }

  if(!awaiting.length && !processes.length){
    return `<div class="empty"><div class="big">${ico('renovar','style="width:32px;height:32px"')}</div>Nenhuma renovação pendente no momento.<br>Quando um mandato estiver a 70 dias do fim, ele aparece aqui para você iniciar o processo.</div>`;
  }
  let html = '';
  if(awaiting.length) html += `<h2 class="sect-title">Aguardando início</h2>` + awaiting.map(awaitingCard).join('') + '<div style="height:16px;"></div>';
  if(emAndamento.length) html += `<h2 class="sect-title">Em andamento</h2>` + emAndamento.map(processCard).join('');
  if(concluidos.length) html += `<h2 class="sect-title" style="margin-top:24px;">Concluídos</h2>` + concluidos.map(processCard).join('');
  return html;
}
function bindRenewalsDashboard(){
  document.querySelectorAll('[data-manage-renewal]').forEach(el=>el.addEventListener('click', ()=>handleRenewalAction(el.dataset.manageRenewal)));
  document.querySelectorAll('[data-open-unit-renewals]').forEach(el=>el.addEventListener('click', ()=>goUnitTab(el.dataset.openUnitRenewals+'|mandatos')));
  document.querySelectorAll('[data-start-renewal]').forEach(el=>el.addEventListener('click', ()=>{
    const mandate = byId(S.mandates, el.dataset.startRenewal);
    if(!mandate) return;
    const unit = byId(S.units, mandate.unitId);
    if(el.dataset.mode==='auto') openRenewalEditModal(unit, mandate, generateAutoRenewalStages(mandate), 'auto');
    else openRenewalEditModal(unit, mandate, generateManualRenewalStages(), 'manual');
  }));
}

/* ---------------- Relatórios (gerais ou individuais) ---------------- */
function renderStabilityTable(rows){
  if(rows.length===0) return `<div class="faint">Nenhum membro.</div>`;
  return `<table><thead><tr><th>Nome</th><th>Unidade</th><th>Setor</th><th>Função</th><th>Representação</th><th>Estabilidade</th></tr></thead><tbody>
  ${rows.map(({member,mandate,unit})=>`<tr>
    <td><b>${esc(member.name)}</b>${member.matricula?`<div class="faint">Matrícula: ${esc(member.matricula)}</div>`:''}</td>
    <td>${esc(unit.name)}</td>
    <td>${esc(member.setor||'—')}</td>
    <td>${esc(member.role||'—')}</td>
    <td>${esc(member.representationType||'—')}</td>
    <td>${stabilityCellHtml(member, mandate)}</td>
  </tr>`).join('')}
  </tbody></table>`;
}

function renderRelatorioGeral(){
  const alerts = computeAllAlerts();
  const processes = allRenewalProcesses();
  const stabilityRows = S.units.flatMap(u=>{
    const am = activeMandate(u.id);
    if(!am) return [];
    return mandateMembers(am.id).map(mm=>({member:mm, mandate:am, unit:u}));
  });
  const unitsRows = S.units.map(u=>{
    const am = activeMandate(u.id);
    const members = am ? mandateMembers(am.id) : [];
    const tech = unitTechnicians(u.id)[0];
    const uAlerts = alerts.filter(a=>a.unit && a.unit.id===u.id).length;
    return `<tr>
      <td><b>${esc(u.name)}</b></td>
      <td>${am? fmtDate(am.startDate)+' – '+fmtDate(am.endDate) : '<span class="faint">sem mandato</span>'}</td>
      <td>${members.length}</td>
      <td>${tech? esc(tech.name) : '<span class="faint">não definido</span>'}</td>
      <td>${uAlerts? `<span class="pill pill-danger">${uAlerts}</span>` : '<span class="pill pill-ok">0</span>'}</td>
    </tr>`;
  }).join('');

  return `
  <div class="card">
    <h3>Relatório geral — Portal CIPA</h3>
    <div class="faint" style="margin-bottom:10px;">Gerado em ${fmtDate(todayISO())}</div>
    <div class="grid">
      <div class="stat"><div class="num">${S.units.length}</div><div class="label">Unidades</div></div>
      <div class="stat"><div class="num">${stabilityRows.length}</div><div class="label">Membros no mandato atual</div></div>
      <div class="stat"><div class="num" style="color:${alerts.length?'var(--danger)':'var(--ok)'}">${alerts.length}</div><div class="label">Alertas ativos</div></div>
      <div class="stat"><div class="num">${processes.length}</div><div class="label">Processos de renovação</div></div>
    </div>
  </div>
  <div class="card">
    <h3>Unidades</h3>
    <table><thead><tr><th>Unidade</th><th>Mandato atual</th><th>Membros</th><th>Técnico responsável</th><th>Alertas</th></tr></thead>
    <tbody>${unitsRows || `<tr><td colspan="5" class="faint">Nenhuma unidade cadastrada.</td></tr>`}</tbody></table>
  </div>
  <div class="card">
    <h3>Membros em estabilidade provisória — mandato atual (todas as unidades)</h3>
    ${renderStabilityTable(stabilityRows)}
  </div>`;
}

function renderRelatorioUnidade(unit){
  const mandates = unitMandates(unit.id);

  const tech = unitTechnicians(unit.id)[0];
  const alerts = computeAllAlerts().filter(a=>a.unit && a.unit.id===unit.id);
  const docs = unitDocuments(unit.id);
  const memberIds = new Set();
  mandates.forEach(m=>mandateMembers(m.id).forEach(mm=>memberIds.add(mm.id)));
  const trainings = S.trainings.filter(t=>memberIds.has(t.memberId));

  return `
  <div class="card">
    <h3>Relatório individual — ${esc(unit.name)}</h3>
    <div class="faint" style="margin-bottom:10px;">Gerado em ${fmtDate(todayISO())}${unit.cnpj?' · CNPJ '+esc(unit.cnpj):''}</div>
    <div class="grid">
      <div class="stat"><div class="num">${am? mandateMembers(am.id).length : 0}</div><div class="label">Membros no mandato atual</div></div>
      <div class="stat"><div class="num">${docs.length}</div><div class="label">Documentos</div></div>
      <div class="stat"><div class="num" style="color:${alerts.length?'var(--danger)':'var(--ok)'}">${alerts.length}</div><div class="label">Alertas ativos</div></div>
      <div class="stat"><div class="num">${trainings.length}</div><div class="label">Treinamentos registrados</div></div>

    <h3>Técnico responsável</h3>

  </div>
  ${alerts.length ? `<div class="card"><h3>Alertas</h3>${alerts.map(alertBoxHtml).join('')}</div>` : `<div class="card"><span class="pill pill-ok">Sem alertas pendentes</span></div>`}
  <div class="card">
    <h3>Membros — mandato atual ${am? '('+fmtDate(am.startDate)+' – '+fmtDate(am.endDate)+')' : ''}</h3>
    ${am ? renderStabilityTable(mandateMembers(am.id).map(mm=>({member:mm, mandate:am, unit}))) : `<div class="faint">Nenhum mandato cadastrado.</div>`}
  </div>
  <div class="card">
    <h3>Histórico de gestões</h3>
    <table><thead><tr><th>Período</th><th>Status</th><th>Membros</th></tr></thead><tbody>
    ${mandates.map(m=>`<tr><td>${fmtDate(m.startDate)} – ${fmtDate(m.endDate)}</td><td>${esc(m.status||'ativo')}</td><td>${mandateMembers(m.id).length}</td></tr>`).join('') || `<tr><td colspan="3" class="faint">Nenhum mandato cadastrado.</td></tr>`}
    </tbody></table>

function renderRelatorios(){
  const tipo = S._relatorioTipo || 'geral';
  if(!S._relatorioUnitId && S.units.length) S._relatorioUnitId = S.units[0].id;
  const unitId = S._relatorioUnitId;
  let body;
  if(tipo==='individual'){
    const unit = byId(S.units, unitId);

        <select id="relTipo">
          <option value="geral" ${tipo==='geral'?'selected':''}>Geral (todas as unidades)</option>
          <option value="individual" ${tipo==='individual'?'selected':''}>Individual (uma unidade)</option>
        </select>
      </div>
      ${tipo==='individual' ? `<div class="field" style="min-width:220px;">

  const selTipo = document.getElementById('relTipo');

/* ---------------- Visão geral (unit) ---------------- */
function raPillCls(ra){
  if(ra.level==='danger') return 'pill-danger';
  if(ra.label==='Em andamento') return 'pill-info';
  return 'pill-warn';
}

function renderVisaoGeral(unit){
  const am = activeMandate(unit.id);
  const alerts = computeAllAlerts().filter(a=>a.unit && a.unit.id===unit.id);
  const members = am ? mandateMembers(am.id) : [];
  const tech = unitTechnicians(unit.id)[0] || null;

  let mandateCard;
  if(!am){
    mandateCard = `<section class="card"><div class="empty" style="padding:24px;">Nenhum mandato cadastrado.<br><br><button class="btn btn-primary" id="btnNewMandateQuick">${ico('plus')}Cadastrar mandato</button></div></section>`;
  } else {
    const ra = mandateRenewalAlert(am);
    const total = daysBetween(am.startDate, am.endDate);
    const elapsed = daysBetween(am.startDate, todayISO());
    const pct = total>0 ? Math.max(0, Math.min(100, Math.round(elapsed/total*100))) : 0;
    const left = daysBetween(todayISO(), am.endDate);
    const hasRenewal = am.renewal && am.renewal.stages && am.renewal.stages.length;
    let banner = '';
    if(ra && ra.invalid){
      banner = `<div class="banner danger" style="margin-top:20px;"><div class="b-text"><div class="b-title">Datas do mandato inválidas</div><div style="font-size:13px;margin-top:2px;">O início está depois do fim. Corrija as datas para o sistema calcular os prazos.</div></div><button class="btn btn-primary" data-fix-mandate="${am.id}">Corrigir mandato</button></div>`;
    } else if(hasRenewal && am.renewal.status!=='concluido'){
      banner = `<div class="banner warn" style="margin-top:20px;"><div class="b-text"><div class="b-title">Renovação em andamento</div><div style="font-size:13px;margin-top:2px;">Acompanhe as etapas do processo eleitoral até a posse da nova CIPA.</div></div><button class="btn btn-primary" data-renewal-action="${am.id}">Gerenciar cronograma</button></div>`;
    } else if(ra){
      const start60 = fmtDate(addDaysISO(am.endDate, -PROCESS_LEAD_DAYS));
      banner = `<div class="banner ${ra.level==='danger'?'danger':'warn'}" style="margin-top:20px;"><div class="b-text"><div class="b-title">${ra.level==='danger'?'Prazo para iniciar a renovação vencido':'Hora de preparar a renovação'}</div><div style="font-size:13px;margin-top:2px;">O cronograma automático da NR-05 começa em ${start60} e inclui ${INSCRICAO_DIAS} dias de inscrição.</div></div><button class="btn btn-primary" data-renewal-action="${am.id}">Iniciar renovação</button></div>`;
    }
    mandateCard = `<section class="card" style="padding:24px;">
      <div class="row">
        <div><div class="lbl-s">Mandato atual</div><div style="font-size:20px;font-weight:600;">${fmtDate(am.startDate)} – ${fmtDate(am.endDate)}</div></div>
        ${unitStatusPill(unit.id)}
      </div>
      ${total>0 ? `<div class="progress" style="margin-top:18px;"><div style="width:${pct}%;"></div></div>
      <div class="row muted" style="font-size:13px;margin-top:8px;"><span>${pct}% do mandato decorrido</span><span>${left>=0?'faltam '+left+' dia(s)':'encerrado há '+Math.abs(left)+' dia(s)'}</span></div>` : ''}
      ${banner}
    </section>`;
  }

  const membersPanel = am ? `<section class="panel">
    <div class="panel-head">Membros do mandato atual <button class="btn btn-sm" data-open-unit-tab="${unit.id}|membros">Ver todos</button></div>
    <table><thead><tr><th>Nome</th><th>Função</th><th>Representação</th><th>Estabilidade</th></tr></thead><tbody>
    ${members.length ? members.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.role||'—')}</td><td>${esc(m.representationType||'—')}</td><td>${stabilityCellHtml(m, am)}</td></tr>`).join('') : `<tr><td colspan="4" class="faint" style="padding:16px;">Nenhum membro cadastrado neste mandato.</td></tr>`}
    </tbody></table>
  </section>` : '';

  return `<div class="two-col">
    <div class="main-col">${mandateCard}${membersPanel}</div>
    <div class="side-col">
      <section class="card">
        <h3>Dados da unidade</h3>
        <div class="lbl-s">CNPJ</div><div style="margin-bottom:14px;">${unit.cnpj? esc(unit.cnpj) : '<span class="faint">não informado</span>'}</div>
        <div class="lbl-s">Técnico responsável</div>
        ${tech ? `<div style="font-weight:500;">${esc(tech.name)}</div><div class="muted" style="font-size:13px;">${esc(tech.type||'')}${tech.registrationNumber?' · '+esc(tech.registrationNumber):''}</div>${tech.contact?`<div class="muted" style="font-size:13px;">${esc(tech.contact)}</div>`:''}`
               : `<div class="faint">Nenhum definido. Use "Editar unidade" para cadastrar.</div>`}
      </section>
      <section class="panel">
        <div class="panel-head">Alertas desta unidade</div>
        <div style="padding:0 20px 16px;">
        ${alerts.length ? alerts.slice(0,5).map(a=>alertBoxHtml(a)).join('') + (alerts.length>5?`<div class="faint">+ ${alerts.length-5} outro(s), veja a aba Alertas</div>`:'') : `<span class="pill pill-ok">Sem alertas pendentes</span>`}
        </div>
      </section>
    </div>
  </div>`;
}

function alertBoxHtml(a){
  const cls = a.level==='danger'?'danger':'warn';
  const icon = ico(a.level==='danger'?'erro':'alerta');
  let action = '';
  if(a.type==='renewal' && a.mandate){
    if(a.invalid){
      action = `<button class="btn btn-sm" data-fix-mandate="${a.mandate.id}" style="margin-left:auto; flex-shrink:0;">Corrigir mandato</button>`;
    } else {
      const hasSchedule = a.mandate.renewal && a.mandate.renewal.stages && a.mandate.renewal.stages.length;
      action = `<button class="btn btn-sm" data-renewal-action="${a.mandate.id}" style="margin-left:auto; flex-shrink:0;">${hasSchedule?'Ver/editar cronograma':'Iniciar renovação'}</button>`;
    }
  }
  return `<div class="alert-box ${cls}"><span>${icon}</span><div class="txt">${a.text}</div>${action}</div>`;
}

function renewalSummaryHtml(renewal){
  const {done, total} = renewalProgress(renewal);
  const status = renewalStatusInfo(renewal);
  const rows = renewal.stages.map(s=>{
    const dateText = s.type==='single' ? fmtDate(s.date) : (fmtDate(s.startDate)+' – '+fmtDate(s.endDate));
    return `<div class="row" style="padding:3px 0; font-size:12.5px;"><span style="display:inline-flex;align-items:center;gap:8px;"><span class="dot ${s.done?'done':''}" style="width:18px;height:18px;border-width:1.5px;">${s.done?ico('check','style="width:11px;height:11px;stroke-width:3"'):''}</span>${esc(s.label)}</span><span class="muted">${dateText}</span></div>`;
  }).join('');
  return `<div style="margin-top:10px; padding:10px 12px; background:var(--surface-2); border-radius:8px;">
    <div class="row" style="margin-bottom:4px;">
      <span class="faint">Cronograma de renovação (${renewal.mode==='auto'?'automático':'manual'}) — ${done}/${total} etapas</span>
      <span class="pill ${status.level==='ok'?'pill-ok':status.level==='danger'?'pill-danger':'pill-warn'}">${status.text}</span>
    </div>
    ${rows}
  </div>`;
}

/* ---------------- Dimensionamento (tela) ---------------- */
function renderDimResult(){
  const config = effectiveDimConfig();
  const grau = S._dimGrau || 1;
  const raw = S._dimNumEmp;
  const n = (raw!=='' && raw!=null) ? Number(raw) : null;
  if(n==null || isNaN(n) || n<=0){
    return `<div class="faint" style="padding:10px 0;">Informe o número de colaboradores para calcular.</div>`;
  }
  const res = calcDimensionamento(config, grau, n);
  if(!res) return '';
  if(res.notRequired){
    return `<div class="alert-box warn" style="margin-top:10px;"><span>ℹ️</span><div class="txt">Faixa "${esc(res.bracketLabel)}" para o grau de risco ${grau}: o Quadro I não exige CIPA formal nesta faixa. Verifique a necessidade de designado, conforme a NR-05.</div></div>`;
  }
  const total = (res.efetivos+res.suplentes)*2;
  return `
  <div class="grid" style="margin-top:12px;">
    <div class="stat"><div class="num">${res.efetivos}</div><div class="label">Efetivos — eleitos (empregados)</div></div>
    <div class="stat"><div class="num">${res.suplentes}</div><div class="label">Suplentes — eleitos (empregados)</div></div>
    <div class="stat"><div class="num">${res.efetivos}</div><div class="label">Efetivos — a indicar (empregador)</div></div>
    <div class="stat"><div class="num">${res.suplentes}</div><div class="label">Suplentes — a indicar (empregador)</div></div>
    <div class="stat"><div class="num">${total}</div><div class="label">Total de membros da CIPA</div></div>
  </div>
  <div class="faint" style="margin-top:8px;">Faixa aplicada: ${esc(res.bracketLabel)} · Grau de risco ${grau}</div>`;
}

function renderDimensionamento(){
  const config = effectiveDimConfig();
  S._dimBuffer = JSON.parse(JSON.stringify(config));
  const grau = S._dimGrau || 1;

  function tableHtml(){
    const head = '<tr><th>Grau</th><th></th>' + config.brackets.map(b=>`<th>${b}</th>`).join('') + '<th>+2.500 acima de 10k</th></tr>';
    let body = '';
    [1,2,3,4].forEach(g=>{
      ['efetivos','suplentes'].forEach(tipo=>{
        const arr = config.matrix[g][tipo];
        const extraVal = config.extra[g][tipo];
        body += `<tr>
          <td>${tipo==='efetivos'?g:''}</td>
          <td class="faint">${tipo==='efetivos'?'Efetivos':'Suplentes'}</td>
          ${arr.map((v,idx)=>`<td><input type="number" min="0" style="width:46px; padding:4px;" data-dim-grau="${g}" data-dim-tipo="${tipo}" data-dim-idx="${idx}" value="${v==null?'':v}"></td>`).join('')}
          <td><input type="number" min="0" style="width:46px; padding:4px;" data-dim-grau="${g}" data-dim-tipo="${tipo}" data-dim-extra="1" value="${extraVal==null?'':extraVal}"></td>
        </tr>`;
      });
    });

function bindDimensionamentoEvents(){
  const grauSel = document.getElementById('dimGrau');
  const numInput = document.getElementById('dimNumEmp');
  if(grauSel){
    grauSel.addEventListener('change', e=>{
      S._dimGrau = Number(e.target.value);
      const box = document.getElementById('dimResult');
      if(box) box.innerHTML = renderDimResult();
    });
  }
  if(numInput){
    numInput.addEventListener('input', e=>{
      S._dimNumEmp = e.target.value;
      const box = document.getElementById('dimResult');
      if(box) box.innerHTML = renderDimResult();
    });
  }
  document.querySelectorAll('[data-dim-grau]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const g = e.target.dataset.dimGrau;
      const tipo = e.target.dataset.dimTipo;
      const val = e.target.value===''? null : Number(e.target.value);
      if(e.target.dataset.dimExtra){
        S._dimBuffer.extra[g][tipo] = val==null?0:val;
      } else {
        const idx = Number(e.target.dataset.dimIdx);
        S._dimBuffer.matrix[g][tipo][idx] = val;
      }
    });
  });
  const btnReset = document.getElementById('btnResetDim');
  if(btnReset) btnReset.addEventListener('click', async ()=>{
    const ok = await dbSet('config', 'dimensionamento', DEFAULT_DIMENSIONAMENTO);
    if(ok) toast('Tabela restaurada ao padrão da NR-05.', 'ok');
  });
  const btnSave = document.getElementById('btnSaveDim');
  if(btnSave) btnSave.addEventListener('click', async ()=>{
    const ok = await dbSet('config', 'dimensionamento', S._dimBuffer);
    if(ok) toast('Tabela de dimensionamento salva.', 'ok');
  });
}

/* ---------------- Atas de reunião ---------------- */
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ATA_TIPOS = ['Ordinária','Extraordinária','Posse','Outra'];

function monthsOfMandate(m){
  const out = [];
  if(!m.startDate || !m.endDate || m.startDate >= m.endDate) return out;
  let y = +m.startDate.slice(0,4), mo = +m.startDate.slice(5,7);
  const ey = +m.endDate.slice(0,4), emo = +m.endDate.slice(5,7);
  while((y<ey || (y===ey && mo<=emo)) && out.length<14){
    out.push({key: y+'-'+String(mo).padStart(2,'0'), label: MESES[mo-1]+'/'+y});
    mo++; if(mo>12){ mo = 1; y++; }
  }
  return out;
}
function mandateAtas(unitId, mandateId){
  return S.documents.filter(d=>d.unitId===unitId && d.mandateId===mandateId && d.kind==='ata')
    .sort((a,b)=>(a.reuniaoData||'').localeCompare(b.reuniaoData||''));
}

function renderAtas(unit){
  const mandates = unitMandates(unit.id);
  if(mandates.length===0){
    return `<div class="empty"><div class="big">${ico('doc','style="width:32px;height:32px"')}</div>Cadastre um mandato antes de registrar atas.</div>`;
  }
  const cur = activeMandate(unit.id) || mandates[0];
  const curMonth = todayISO().slice(0,7);
  const ataLine = d => `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 0;">
      <span><b>${esc(d.reuniaoTipo||'Ata')}</b> · ${d.reuniaoData?fmtDate(d.reuniaoData):'sem data'}${d.pauta?`<span class="faint"> · ${esc(d.pauta.length>60?d.pauta.slice(0,60)+'…':d.pauta)}</span>`:''}</span>
      <button class="btn btn-sm" data-open-file="${d.assetId}" data-name="${esc(d.name)}">Abrir</button>
      <button class="btn btn-sm btn-danger" data-del-doc="${d.id}">Excluir</button>
    </div>`;
  return `
  <div class="row" style="margin-bottom:8px; align-items:flex-start;">
    <div>
      <div class="sect-title" style="margin:0;">Atas de reunião</div>
      <div class="muted" style="font-size:13px; margin-top:2px; max-width:680px;">Registre e anexe a ata de cada reunião da CIPA. As atas ficam guardadas junto da documentação da gestão (aba Documentos). A CIPA se reúne ordinariamente todo mês, então cada mês da gestão aparece abaixo com a situação da ata.</div>
    </div>
    <button class="btn btn-primary" id="btnNewAta" data-mandate="${cur.id}">${ico('plus')}Registrar ata</button>
  </div>
  <div style="height:12px;"></div>
  ${mandates.map(m=>{
    const months = monthsOfMandate(m);
    const atas = mandateAtas(unit.id, m.id);
    const byMonth = {};
    atas.forEach(a=>{ const k = (a.reuniaoData||'').slice(0,7); (byMonth[k] = byMonth[k]||[]).push(a); });
    const isCur = cur.id===m.id;
    const expanded = S._expandedMandates['ata_'+m.id]!==undefined ? S._expandedMandates['ata_'+m.id] : isCur;
    const withAta = months.filter(x=>byMonth[x.key]).length;
    const pending = months.filter(x=>!byMonth[x.key] && x.key<curMonth).length;
    const monthKeys = new Set(months.map(x=>x.key));
    const extras = atas.filter(a=>!monthKeys.has((a.reuniaoData||'').slice(0,7)));
    const head = `<div class="panel-head">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;"><span>${fmtDate(m.startDate)} – ${fmtDate(m.endDate)}</span>${isCur?'<span class="pill pill-info">Gestão atual</span>':'<span class="pill pill-muted">Encerrada</span>'}</div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <span class="muted" style="font-weight:400;font-size:13px;">${withAta} de ${months.length} meses com ata${pending?` · <b style="color:var(--warn)">${pending} pendente(s)</b>`:''}</span>
          <button class="btn btn-sm" data-toggle-ata="${m.id}">${expanded?'Ocultar':'Ver atas'}</button>
        </div>
      </div>`;
    const rows = months.map(x=>{
      const list = byMonth[x.key] || [];
      let pill;
      if(list.length) pill = `<span class="pill pill-ok">Ata anexada</span>`;
      else if(x.key < curMonth) pill = `<span class="pill pill-warn">Pendente</span>`;
      else if(x.key === curMonth) pill = `<span class="pill pill-info">Neste mês</span>`;
      else pill = `<span class="pill pill-muted">Previsto</span>`;
      return `<tr>
        <td style="white-space:nowrap;font-weight:500;">${x.label}</td>
        <td>${pill}</td>
        <td>${list.length ? list.map(ataLine).join('') : '<span class="faint">Nenhuma ata registrada</span>'}</td>
        <td><button class="btn btn-sm" data-add-ata="1" data-mandate="${m.id}" data-month="${x.key}">${ico('upload')}Anexar ata</button></td>
      </tr>`;
    }).join('');
    const extraRows = extras.length ? `<tr><td style="font-weight:500;">Fora do período</td><td><span class="pill pill-muted">Outras</span></td><td>${extras.map(ataLine).join('')}</td><td></td></tr>` : '';
    const body = expanded ? `<table><thead><tr><th>Mês</th><th>Situação</th><th>Atas</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="faint" style="padding:16px;">Datas do mandato inválidas.</td></tr>'}${extraRows}</tbody></table>` : '';
    return `<section class="panel" style="margin-bottom:16px;">${head}${body}</section>`;
  }).join('')}`;
}

function renderAlertasTab(unit){

/* ---------------- event binding per tab ---------------- */
function bindTabEvents(unit){
  const q = sel => document.querySelectorAll(sel);
  const b = (sel, fn) => { const els = q(sel); els.forEach(el=>el.addEventListener('click', ()=>fn(el))); };

  b('#btnNewMandate, #btnNewMandateQuick', ()=>openMandateModal(unit));
  b('[data-edit-mandate]', el=>openMandateModal(unit, byId(S.mandates, el.dataset.editMandate)));
  b('[data-del-mandate]', async el=>{
    if(confirm('Excluir este mandato? Membros e documentos vinculados continuarão existindo mas ficarão órfãos.')){
      await dbDelete('mandates', el.dataset.delMandate);
      toast('Mandato excluído.', 'ok');
    }
  });

  b('#btnNewMember', el=>openMemberModal(unit, el.dataset.mandate));
  b('[data-add-member-mandate]', el=>openMemberModal(unit, el.dataset.addMemberMandate));
  b('#btnDownloadTemplate', ()=>downloadMemberTemplate());
  b('#btnImportMembers', ()=>openImportMembersModal(unit));
  b('[data-edit-member]', el=>{
    const mem = byId(S.members, el.dataset.editMember);
    openMemberModal(unit, mem.mandateId, mem);
  });
  b('[data-del-member]', async el=>{
    const id = el.dataset.delMember;
    const nTr = S.trainings.filter(t=>t.memberId===id).length;
    if(confirm('Excluir este membro?'+(nTr ? ' Os '+nTr+' treinamento(s) dele também serão excluídos.' : ''))){
      await deleteMembersCascade([id]); delete S._selMembers[id]; toast('Membro excluído.', 'ok');
    }
  });
  document.querySelectorAll('[data-sel-member]').forEach(el=>el.addEventListener('change', ()=>{
    S._selMembers[el.dataset.selMember] = el.checked; renderMain();
  }));
  document.querySelectorAll('[data-sel-all]').forEach(el=>el.addEventListener('change', ()=>{
    mandateMembers(el.dataset.selAll).forEach(mm=>{ S._selMembers[mm.id] = el.checked; });
    renderMain();
  }));
  b('#btnClearSel', ()=>{ S._selMembers = {}; renderMain(); });
  b('#btnBulkDelMembers', async ()=>{
    const ids = selectedMemberIds(unit);
    if(!ids.length) return;
    const nTr = S.trainings.filter(t=>ids.includes(t.memberId)).length;
    const msg = 'Excluir '+ids.length+' membro(s)?'+(nTr ? ' Os '+nTr+' treinamento(s) e certificados deles também serão excluídos.' : '')+'\n\nEsta ação não pode ser desfeita.';
    if(!confirm(msg)) return;
    const n = await deleteMembersCascade(ids);
    S._selMembers = {};
    toast(n+' membro(s) excluído(s).', 'ok');
    renderMain();
  });

    const cur = S._expandedMandates[key]!==undefined ? S._expandedMandates[key] : ((activeMandate(unit.id)||{}).id===id);

    renderMain();
  });
  b('#btnDownloadTrTemplate', ()=>downloadTrainingTemplate());
  b('#btnImportTrainings', ()=>openImportTrainingsModal(unit));
  b('#btnGroupTraining', ()=>openGroupTrainingModal(unit));

  b('#btnNewDoc', el=>openDocModal(unit, el.dataset.mandate));
  b('[data-add-doc-mandate]', el=>openDocModal(unit, el.dataset.addDocMandate));
  b('[data-del-doc]', async el=>{
    if(confirm('Excluir este documento?')){
      const doc = byId(S.documents, el.dataset.delDoc);
      await dbDelete('documents', el.dataset.delDoc);
      if(doc && doc.assetId && S.assets){ try{ await S.assets.delete(doc.assetId); }catch(e){} }
      toast('Documento excluído.', 'ok');
    }
  });

  b('#btnNewTraining', ()=>openTrainingModal(unit));
  b('[data-del-training]', async el=>{
    if(confirm('Excluir este registro de treinamento?')){
      const t = byId(S.trainings, el.dataset.delTraining);
      await dbDelete('trainings', el.dataset.delTraining);
      if(t && t.certificateAssetId && S.assets){ try{ await S.assets.delete(t.certificateAssetId); }catch(e){} }
      toast('Treinamento excluído.', 'ok');
    }
  });

  b('[data-renewal-action]', el=>{
    const mandate = byId(S.mandates, el.dataset.renewalAction);
    if(!mandate) return;
    if(mandate.renewal && mandate.renewal.stages && mandate.renewal.stages.length){
      openRenewalEditModal(unit, mandate, mandate.renewal.stages.map(s=>({...s})), mandate.renewal.mode);
    } else {
      openRenewalChoiceModal(unit, mandate);
    }
  });

  b('#btnEditUnitInline', ()=>openUnitModal(unit));
  b('[data-open-file]', el=>openStoredFile(el.dataset.openFile, el.dataset.name));
  b('[data-open-unit-tab]', el=>goUnitTab(el.dataset.openUnitTab));
  b('[data-fix-mandate]', el=>openMandateModal(unit, byId(S.mandates, el.dataset.fixMandate)));
  b('[data-toggle-mandate]', el=>{
    const id = el.dataset.toggleMandate;
    const cur = S._expandedMandates[id]!==undefined ? S._expandedMandates[id] : ((activeMandate(unit.id)||{}).id===id);
    S._expandedMandates[id] = !cur;
    renderMain();
  });

  bindDimensionamentoEvents();
}

/* ---------------- modal shell ---------------- */
function openModal(title, bodyHtml, footHtml){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-backdrop" id="mBackdrop">
    <div class="modal">
      <div class="modal-head"><h3>${title}</h3><button class="modal-close" id="mClose" aria-label="Fechar">${ico('plus','style="transform:rotate(45deg)"')}</button></div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-foot">${footHtml}</div>
    </div>
  </div>`;
  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ---------------- Unit modal (criar/editar unidade + técnico responsável) ---------------- */
function openUnitModal(unit){
  const draft = {
    name: unit ? unit.name : '',
    cnpj: unit ? (unit.cnpj||'') : '',
    technicianId: unit ? (unit.technicianId||'') : ''
  };
  let addingTech = false;

  function captureDraft(){
    const n = document.getElementById('fUnitName');
    const c = document.getElementById('fUnitCnpj');
    const t = document.getElementById('fUnitTech');
    if(n) draft.name = n.value.trim();
    if(c) draft.cnpj = c.value.trim();
    if(t) draft.technicianId = t.value;
  }

  function formBodyHtml(){
    return `
    <div class="field"><label>Nome da unidade *</label><input id="fUnitName" placeholder="Ex: FIEG – Unidade Setor Norte" value="${esc(draft.name)}"></div>
    <div class="field"><label>CNPJ (opcional)</label><input id="fUnitCnpj" placeholder="00.000.000/0000-00" value="${esc(draft.cnpj)}"></div>
    <div class="field">
      <label>Técnico responsável</label>
      <div style="display:flex; gap:6px;">
        <select id="fUnitTech" style="flex:1;">
          <option value="">— nenhum —</option>
          ${S.technicians.map(t=>`<option value="${t.id}" ${draft.technicianId===t.id?'selected':''}>${esc(t.name)}${t.type?' — '+esc(t.type):''}</option>`).join('')}
        </select>
        <button type="button" class="btn btn-sm" id="btnEditSelectedTech" title="Editar técnico selecionado" aria-label="Editar técnico selecionado">${ico('editar')}</button>
        <button type="button" class="btn btn-sm" id="btnNewTechInline" title="Cadastrar novo técnico" aria-label="Cadastrar novo técnico">${ico('plus')}</button>
      </div>
      <div class="hint">Você pode trocar o técnico responsável a qualquer momento, editando a unidade.</div>
    </div>`;
  }

  function addTechBodyHtml(){
    return `
    <div class="hint" style="margin-bottom:2px;">Cadastrar novo técnico responsável. Ao concluir, ele já fica selecionado para esta unidade.</div>
    <div class="field"><label>Nome completo *</label><input id="fTQName"></div>
    <div class="field-row">
      <div class="field"><label>Tipo</label>
        <select id="fTQType">
          <option value="Técnico de Segurança do Trabalho">Técnico de Segurança do Trabalho</option>
          <option value="Engenheiro de Segurança">Engenheiro de Segurança</option>
          <option value="Médico do Trabalho">Médico do Trabalho</option>
          <option value="Enfermeiro do Trabalho">Enfermeiro do Trabalho</option>
        </select>
      </div>
      <div class="field"><label>Nº de registro</label><input id="fTQReg" placeholder="MTE / CREA / conselho"></div>
    </div>
    <div class="field"><label>Contato (e-mail/telefone)</label><input id="fTQContact"></div>
    <div class="top-actions" style="margin-top:4px;">
      <button type="button" class="btn btn-sm" id="btnCancelNewTech">Voltar</button>
      <button type="button" class="btn btn-sm btn-primary" id="btnConfirmNewTech">Adicionar técnico</button>
    </div>`;
  }

  function render(){
    openModal(
      unit? 'Editar unidade' : 'Nova unidade',
      addingTech ? addTechBodyHtml() : formBodyHtml(),
      addingTech ? '' : `<button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Salvar</button>`
    );
    bind();
  }

  function bind(){
    if(!addingTech){
      document.getElementById('mCancel').addEventListener('click', closeModal);
      document.getElementById('btnNewTechInline').addEventListener('click', ()=>{ captureDraft(); addingTech=true; render(); });
      document.getElementById('btnEditSelectedTech').addEventListener('click', ()=>{
        captureDraft();
        if(!draft.technicianId){ toast('Selecione um técnico para editar.', 'err'); return; }
        openTechModal(byId(S.technicians, draft.technicianId));
      });
      document.getElementById('mSave').addEventListener('click', async ()=>{
        captureDraft();
        if(!draft.name){ toast('Informe o nome da unidade.', 'err'); return; }
        const data = {name: draft.name, cnpj: draft.cnpj, technicianId: draft.technicianId||null};
        let ok;
        if(unit) ok = await dbUpdate('units', unit.id, data);
        else { const id = await dbAdd('units', data); ok = !!id; if(id) S.currentUnitId = id; }
        if(ok){ closeModal(); toast(unit? 'Unidade atualizada.' : 'Unidade cadastrada.', 'ok'); }
      });
    } else {
      document.getElementById('btnCancelNewTech').addEventListener('click', ()=>{ addingTech=false; render(); });
      document.getElementById('btnConfirmNewTech').addEventListener('click', async ()=>{
        const name = document.getElementById('fTQName').value.trim();
        if(!name){ toast('Informe o nome do técnico.', 'err'); return; }
        const id = await dbAdd('technicians', {
          name, type: document.getElementById('fTQType').value,
          registrationNumber: document.getElementById('fTQReg').value.trim(),
          contact: document.getElementById('fTQContact').value.trim()
        });
        if(id){ draft.technicianId = id; addingTech=false; toast('Técnico cadastrado.', 'ok'); render(); }
      });
    }
  }

  render();
}

      <div class="field"><label>Início *</label><input type="date" id="fMStart" value="${mandate?mandate.startDate:''}"></div>

      <select id="fMStatus">
